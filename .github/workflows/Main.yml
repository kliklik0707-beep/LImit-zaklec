

name: Build D2ModdingToolset Win32

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release Win32
        shell: cmd
        run: |
          msbuild mss32\mss32.sln /m /p:Configuration=Release /p:Platform=Win32 /bl:build.binlog

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: build.binlog
          if-no-files-found: warn

      - name: Upload compiled DLL
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mss32-release
          path: |
            **/Release/mss32.dll
            **/Release/Mss32.dll
          if-no-files-found: warn

