

name: Build D2ModdingToolset Win32

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2


      - name: Build Release Win32
        shell: pwsh
        run: |
          Write-Host "Repository: $env:GITHUB_REPOSITORY"
          Write-Host "Branch: $env:GITHUB_REF_NAME"
          Write-Host "Working directory: $(Get-Location)"

          Write-Host "Files in repository root:"
          Get-ChildItem -Force | Select-Object Name

          Write-Host "Looking for mss32.vcxproj:"
          $project = Get-ChildItem -Recurse -File -Filter "mss32.vcxproj" |
            Select-Object -First 1

          if (-not $project) {
            throw "Project not found. Check repository and branch."
          }

          Write-Host "Building: $($project.FullName)"
          & msbuild $project.FullName /m /p:Configuration=Release /p:Platform=Win32 /bl:build.binlog

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed: $LASTEXITCODE"
          }


      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: build.binlog
          if-no-files-found: warn

      - name: Upload compiled DLL
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mss32-release
          path: |
            **/Release/mss32.dll
            **/Release/Mss32.dll
          if-no-files-found: warn

