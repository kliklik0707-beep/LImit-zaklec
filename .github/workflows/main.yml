
name: Build D2ModdingToolset

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout sources and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

    - name: Setup MSBuild
  uses: microsoft/setup-msbuild@v2

- name: Build Release Win32
  shell: cmd
  run: |
    msbuild mss32\mss32.sln /m /p:Configuration=Release /p:Platform=Win32 /bl:build.binlog

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.binlog

      - name: Upload compiled DLL
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mss32-release
          path: mss32\Release\mss32.dll
          if-no-files-found: error
